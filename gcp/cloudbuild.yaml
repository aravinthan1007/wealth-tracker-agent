steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/wealth-backend:$SHORT_SHA', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wealth-backend:$SHORT_SHA']
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy wealth-backend \
          --image gcr.io/$PROJECT_ID/wealth-backend:$SHORT_SHA \
          --region us-central1 --platform managed --quiet
images:
  - 'gcr.io/$PROJECT_ID/wealth-backend:$SHORT_SHA'
