version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - MCP_YAHOO_URL=http://mcp-yahoo:8001
      - MCP_DUCKDUCKGO_URL=http://mcp-duckduckgo:8002
      - MCP_FETCH_URL=http://mcp-fetcher:8003
      - MCP_MEMORY_URL=http://mcp-memory:8004
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - PHOENIX_HOST=http://phoenix:6006
      - PHOENIX_PROJECT=wealthtrack-agent
      - PHOENIX_ENABLED=true
    depends_on:
      - mcp-yahoo
      - mcp-duckduckgo
      - mcp-fetcher
      - mcp-memory
      - phoenix

  # ── Arize Phoenix — AI observability for the ReAct agent ─────────────────────
  # Traces every Gemini call and tool invocation.
  # Access the Phoenix UI at http://localhost:6006
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - '6006:6006'   # Phoenix UI + REST API
      - '4317:4317'   # OTLP gRPC (optional)
    environment:
      - PHOENIX_WORKING_DIR=/phoenix-data
      - PHOENIX_PROJECT_NAME=wealthtrack-agent
    volumes:
      - phoenix-data:/phoenix-data

  mcp-yahoo:
    build:
      context: ./backend/mcp-mock/yahoo
    ports:
      - '8001:8001'

  mcp-duckduckgo:
    build:
      context: ./backend/mcp-mock/duckduckgo
    ports:
      - '8002:8002'

  mcp-fetcher:
    build:
      context: ./backend/mcp-mock/fetcher
    ports:
      - '8003:8003'

  mcp-memory:
    build:
      context: ./backend/mcp-mock/memory
    ports:
      - '8004:8004'

volumes:
  phoenix-data:
